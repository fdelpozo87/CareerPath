name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (React + servidor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Textos (paridad es/en)
        run: npm run i18n:check
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build (tsc + vite)
        run: npm run build
      - name: Los archivos generados de i18n están al día
        run: |
          npm run i18n
          git diff --exit-code -- shared/locales/dictionaries.ts web_jaspr/lib/i18n/strings.g.dart

  e2e:
    name: Punta a punta (Chrome)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Pruebas de punta a punta (con Supabase y /api simulados)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-informe
          path: |
            playwright-report
            test-results
          retention-days: 7

  jaspr:
    name: Jaspr (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_jaspr
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
