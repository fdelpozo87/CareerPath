<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget=resizes-content: en Chrome del celular, el teclado achica la página (y el chat) en lugar de taparla. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="description" content="Bivio - Tu próximo paso de carrera, pensado con vos. Coach de carrera IA disponible para profesionales y empresas." />
    <meta name="theme-color" content="#781633" />

    <!-- Apariencia e idioma: se resuelven antes del primer dibujado (sin destello claro, y con el lang correcto). Misma regla que src/lib/theme.ts y src/lib/i18n.ts. -->
    <script>
      (function () {
        try {
          var l = localStorage.getItem('cp_lang');
          var en = l === 'en' || (l !== 'es' && (navigator.language || '').toLowerCase().indexOf('en') === 0);
          document.documentElement.setAttribute('lang', en ? 'en' : 'es');
          var m = localStorage.getItem('cp_theme');
          var dark = m === 'dark' || (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#170e12' : '#781633');
        } catch (e) {}
      })();
    </script>

    <!-- Fraunces (títulos) + Hanken Grotesk (texto): la tipografía del diseño del equipo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>Bivio - Tu próximo paso de carrera</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
