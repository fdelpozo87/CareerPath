<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#6a3fc1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Esta página no existe · Bivio</title>
    <style>
      :root { color-scheme: light dark; --bg:#faf9fc; --fg:#1d1530; --muted:#4d4363; --violet:#6a3fc1; --mandarina:#f28c38; }
      @media (prefers-color-scheme: dark) { :root { --bg:#150e24; --fg:#f3eefc; --muted:#b9aed0; --violet:#b79cf2; } }
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font-family:'Hanken Grotesk',system-ui,sans-serif; line-height:1.6; }
      main { max-width:30rem; padding:2rem 1.5rem; }
      img { width:56px; height:auto; }
      h1 { font-family:Fraunces,Georgia,serif; font-weight:500; font-size:2rem; line-height:1.15; margin:1rem 0 .5rem; }
      p { color:var(--muted); margin:0 0 1.5rem; }
      a { display:inline-block; background:var(--mandarina); color:#1d1530; font-weight:600; text-decoration:none; padding:.75rem 1.5rem; border-radius:999px; }
      a:focus-visible { outline:3px solid var(--violet); outline-offset:3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="Bivio" width="56" height="50" />
      <h1>Esta página no existe</h1>
      <p>Puede que el enlace esté mal escrito o que la página ya no esté. Desde la portada puedes retomar tu proceso.</p>
      <a href="/">Volver a Bivio</a>
    </main>
  </body>
</html>
