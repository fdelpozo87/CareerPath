name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (React + servidor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Textos (paridad es/en)
        run: npm run i18n:check
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build (tsc + vite)
        run: npm run build
      - name: Los archivos generados de i18n están al día
        run: |
          npm run i18n
          git diff --exit-code -- shared/locales/dictionaries.ts web_jaspr/lib/i18n/strings.g.dart

  jaspr:
    name: Jaspr (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_jaspr
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
